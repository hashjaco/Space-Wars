name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # JavaFX natives are platform specific, so one jar cannot run everywhere. Each runner builds a
  # self-contained jar for its own platform.
  jars:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build shaded jar
        run: mvn -B --no-transfer-progress -DskipTests package -Pshaded

      - name: Name the artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/space-case-*-all.jar "dist/space-case-${{ matrix.label }}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: space-case-${{ matrix.label }}
          path: dist/*.jar

  publish:
    needs: jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach jars to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
          generate_release_notes: true
          body: |
            Run with a JDK 26 runtime:

                java -jar space-case-<your-platform>.jar

            Each jar bundles the JavaFX runtime for one platform, so pick the one matching your OS.

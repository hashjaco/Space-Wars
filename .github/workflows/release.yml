name: Release

on:
  push:
    tags: ['v*']
  # Rebuilds an existing tag's downloads, e.g. after a platform is added to the matrix. Assets
  # with the same name are replaced; the code built is the tag's, only this workflow is newer.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v2.1.0
        required: true

permissions:
  contents: write

jobs:
  # JavaFX and SDL natives are platform specific, so one build cannot run everywhere. Each runner
  # produces an installer carrying its own runtime, plus the bare jar for anyone who already has a
  # JDK.
  jars:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
            installer: dmg
            installerArgs: ""
          # macos-latest is Apple Silicon only. GitHub's last Intel image; drop this entry when
          # GitHub retires it.
          - os: macos-15-intel
            label: macos-intel
            installer: dmg
            installerArgs: ""
          - os: ubuntu-latest
            label: linux
            installer: deb
            installerArgs: "--linux-shortcut"
          - os: windows-latest
            label: windows
            installer: msi
            installerArgs: "--win-shortcut --win-menu"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build shaded jar
        run: mvn -B --no-transfer-progress -DskipTests package -Pshaded

      - name: Name the artifact
        shell: bash
        run: |
          mkdir -p dist staging
          cp target/space-case-*-all.jar "dist/space-case-${{ matrix.label }}.jar"
          cp target/space-case-*-all.jar staging/

      # jpackage builds a .deb through fakeroot, which the runner image does not always carry.
      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      # jpackage ships inside the JDK. It bundles a cut-down runtime with the app, so the installer
      # needs no Java on the player's machine.
      - name: Build installer
        shell: bash
        run: |
          jar=$(basename staging/*.jar)
          version=$(echo "$jar" | sed 's/space-case-\(.*\)-all\.jar/\1/')
          jpackage --type ${{ matrix.installer }} \
            --name SpaceCase --app-version "$version" \
            --input staging --main-jar "$jar" \
            --main-class com.hashimjacobs.spacecase.Launcher \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --dest dist ${{ matrix.installerArgs }}

      # Both Mac runners name their image SpaceCase-<version>.dmg; keep them apart on the release.
      - name: Mark the Intel installer
        if: matrix.label == 'macos-intel'
        shell: bash
        run: for f in dist/*.dmg; do mv "$f" "${f%.dmg}-intel.dmg"; done

      - uses: actions/upload-artifact@v4
        with:
          name: space-case-${{ matrix.label }}
          path: |
            dist/*.jar
            dist/*.dmg
            dist/*.deb
            dist/*.msi

  # The Android TV build, by the same workflow that makes the test builds.
  androidtv:
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit

  # A failed Android build must not hold back the desktop installers: it is the newest and least
  # proven of the five, so the release goes out with whatever did build.
  publish:
    needs: [jars, androidtv]
    if: ${{ !cancelled() && needs.jars.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # By name, not everything: the Android job also uploads its logs and generated manifest.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: space-case-*
          merge-multiple: true

      - name: Attach installers and jars to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.msi
            artifacts/*.jar
            artifacts/*.apk
          generate_release_notes: true
          body: |
            ## Install

            Download the one for your machine. Java is included — you do not need to install it.

            | | |
            |---|---|
            | macOS (Apple Silicon) | `SpaceCase-*.dmg` |
            | macOS (Intel) | `SpaceCase-*-intel.dmg` |
            | Windows | `SpaceCase-*.msi` |
            | Linux | `spacecase_*.deb` |
            | Android TV (Nvidia Shield and others) | `SpaceCase-*-androidtv.apk` |

            The builds are unsigned. macOS will refuse the first launch: right-click the app and
            choose **Open**, then confirm. Windows may show a SmartScreen notice — **More info**,
            then **Run anyway**.

            ## Already have a JDK 26?

                java -jar space-case-<your-platform>.jar

            Each jar carries the JavaFX and controller natives for one platform, so pick the one
            matching your OS.

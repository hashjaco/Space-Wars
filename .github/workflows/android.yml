# Builds an experimental Android APK (arm64) through GluonFX, for sideloading onto an Android TV box
# such as the Nvidia Shield. Run by hand; nothing here is part of a release.
#
# What the APK is not, yet: it has no sound (the desktop audio code cannot run in a native image),
# no gamepad support (the SDL library is desktop-only) and no Android TV launcher entry. It exists to
# find out whether the game starts and holds a frame rate on the device before any of that is built.
#
# The steps follow Gluon's own reference build, gluonhq/hello-gluon-ci. Gluon only builds Android
# targets on Linux. Signed with a fixed key held in repository secrets, so each build installs over the last.
name: Android (experimental)

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Sets GRAALVM_HOME. The java17 Final build, not the newer java23 one: that one rejects an
      # option Gluon's Android target passes (gluonfx-maven-plugin issue 539).
      - name: Set up Gluon's GraalVM
        uses: gluonhq/setup-graalvm@master
        with:
          graalvm: '22.1.0.1-Final'
          jdk: 'java17'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The JDK that Maven and the Android Gradle build run on; native-image still comes from
      # GRAALVM_HOME above.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up the Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Install native build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      # The fixed signing key, from repository secrets, so one build installs over the last. Written
      # outside the workspace so it cannot be swept into an artifact.
      - name: Write the signing keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/space-case.keystore"
          test -s "$RUNNER_TEMP/space-case.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build the APK
        run: |
          export ANDROID_SDK=$ANDROID_HOME
          export GLUON_ANDROID_KEYSTOREPATH="$RUNNER_TEMP/space-case.keystore"
          ./mvnw -B --no-transfer-progress -Pmobile -Dgluonfx.target=android -DskipTests gluonfx:build gluonfx:package
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          GLUON_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GLUON_ANDROID_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GLUON_ANDROID_KEYALIAS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      # The generated manifest rides along so the Android TV launcher entry can be written against
      # what Gluon actually produces. Logs too, on a failure, since native-image's are long.
      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-case-android
          if-no-files-found: warn
          path: |
            target/gluonfx/aarch64-android/gvm/*.apk
            target/gluonfx/aarch64-android/gensrc/android/AndroidManifest.xml
            target/gluonfx/aarch64-android/gvm/log/*.log
            target/gluonfx/log/*.log

<!doctype html>
<meta charset="utf-8">
<title>Space Case end card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0a0e1a; overflow: hidden; }
  .stage {
    position: relative; width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background:
      radial-gradient(80% 70% at 50% 42%, rgba(154,107,255,.10), transparent 68%),
      #0a0e1a;
  }
  .rule { width: 8em; height: 3px; background: #0ec417; margin-bottom: 1.1em; }
  .word {
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 15.5vh; line-height: .92; text-align: center;
    background: linear-gradient(180deg, #fff 36%, #0ec417 126%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1.5px #05070c;
    filter: drop-shadow(0 0 2.6vh rgba(14,196,23,.40));
  }
  .facts {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 2.5vh; letter-spacing: .21em; color: #a9b6c9;
    margin-top: 2.1em; text-align: center;
  }
  .facts b { color: #fff; font-weight: 600; }
  .sub {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 1.95vh; letter-spacing: .19em; color: #6d7a90;
    margin-top: 1.5em;
  }
  .spectrum { display: flex; gap: 7px; margin-top: 3.1em; }
  .spectrum i { width: 3.6em; height: 5px; border-radius: 1px; }
</style>
<div class="stage">
  <div class="rule"></div>
  <div class="word">SPACE CASE</div>
  <div class="facts"><b>50</b> LEVELS &nbsp;·&nbsp; <b>50</b> FLAGSHIPS &nbsp;·&nbsp; <b>FIVE</b> GALAXIES</div>
  <div class="sub">TWO PLAYERS, ONE KEYBOARD &nbsp;·&nbsp; MACOS &nbsp; WINDOWS &nbsp; LINUX</div>
  <div class="spectrum">
    <i style="background:#0ec417"></i>
    <i style="background:#e8641c"></i>
    <i style="background:#4fd0e8"></i>
    <i style="background:#7ea8ff"></i>
    <i style="background:#9a6bff"></i>
  </div>
</div>
